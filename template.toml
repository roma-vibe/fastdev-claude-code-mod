# Manifest reference: docs/manifest.md
schema = 1
id = "claude-code-mod"
name = "Claude Code Mod"
description = "A mod for Claude Code: a plugin of function hooks written in TypeScript that hot-reloads in the running session. It ships one tiny feature, the text “Hello from fastDev” in Claude Code's status line, and everything around it that a real mod needs: a `/<name>` slash command (status, on, off, reload, ui), a settings file shared by the hooks and a local settings page (Vue 3, styled with Tailwind CSS 4 or plain CSS, your choice) with an on/off switch, a language choice (English or Russian) and the greeting text, a dependency-free settings server, unit tests with a fake engine, ESLint, and Claude Code's own validator in the quality gate. Choose it to start a new mod quickly: replace the greeting with the real behaviour and add settings one by one."
category = "other"
languages = ["node"]
tags = ["claude-code", "mod", "plugin", "hooks", "typescript", "vue", "tailwind", "eslint"]
stack = [
  "Claude Code mod (function hooks)",
  "TypeScript 5.9",
  "Node.js 24+",
  "Vue 3",
  "Vite 8",
  "Tailwind CSS 4 (or plain CSS)",
  "Vitest 5",
  "ESLint 10",
]

[requirements]
node = ">=24"
npm = ">=10"

[env]
APP_NAME = "{{ project.name }}"
APP_SLUG = "{{ project.slug }}"

[ports]
UI_PORT = 4777
UI_DEV_PORT = 5173

[[set]]
file = "package.json"
path = ["name"]
value = "{{ project.slug }}"

[[set]]
file = "package-lock.json"
path = ["name"]
value = "{{ project.slug }}"

[[set]]
file = "package-lock.json"
path = ["packages", "", "name"]
value = "{{ project.slug }}"

# The plugin name is the mod's identity: the slash command `/<name>`, the data folder
# `~/.claude/mod-data/<name>`. It must be the slug.
[[set]]
file = ".claude-plugin/plugin.json"
path = ["name"]
value = "{{ project.slug }}"

[[set]]
file = ".claude-plugin/plugin.json"
path = ["author", "name"]
value = "{{ project.name }}"

[[setup]]
label = "Install dependencies"
run = "npm install"

[[setup]]
label = "Write Claude Code types"
run = "npm run types"

[commands.dev]
label = "Dev"
run = "npm run dev"
description = "The settings page with hot reload, and the settings server it talks to."
long = true
url = "http://localhost:${UI_DEV_PORT}"
primary = true

[commands.build]
label = "Build"
run = "npm run build"
description = "Builds the settings page (ui/dist), which the settings server serves."

[commands.start]
label = "Settings UI"
run = "npm start"
description = "The settings server with the built page; it is what the /<name> ui command starts."
long = true
url = "http://localhost:${UI_PORT}"

[commands.test]
label = "Test"
run = "npm test"

[commands.check]
label = "Check"
run = "npm run check"
description = "ESLint, formatting, types, tests, build and Claude Code's own validation of the mod."

[commands.lint]
label = "Lint"
run = "npm run lint"
description = "ESLint with zero warnings allowed."

[commands.types]
label = "Claude Code types"
run = "npm run types"
description = "Rewrites .claude/types for the Claude Code version you run. Run it after updating Claude Code."

[commands.validate]
label = "Validate mod"
run = "npm run validate"
description = "Asks Claude Code to validate the plugin manifest and the hooks module the way it loads them."

[choices.css]
label = "Styles"
description = "How the settings page is styled. The page uses the same class names with both options."
default = "tailwind"

[choices.css.options.tailwind]
label = "Tailwind CSS"
description = "Tailwind CSS 4: the page's building blocks (.card, .btn, …) are component classes built from utilities."

[choices.css.options.none]
label = "Plain CSS"
description = "One hand-written stylesheet with CSS variables and a dark theme, no CSS framework."

[verify]
commands = ["check"]
# The default selection (Tailwind CSS) runs first.
variants = [{ css = "none" }]

[preview]
command = "dev"
message = "The settings page of the mod is open: switch the mod on and off, change the language (English or Russian) and the greeting, and save. In Claude Code the greeting appears in the status line. To try it there, start Claude Code with `claude --plugin-dir ${PREVIEW_DIR}`, type /<project slug> and then /<project slug> ui. In a project, the README explains how to load the mod in every session."

